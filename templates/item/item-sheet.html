<form class="my-system item-sheet" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" height="100" width="100"/>
    <div class="header-fields">
      <h1><input name="name" type="text" value="{{item.name}}" placeholder="Название"/></h1>
    </div>
  </header>

  <div class="sheet-content">
    <div class="field">
      <label>Описание</label>
      <textarea name="system.description" rows="6">{{system.description}}</textarea>
    </div>
  </div>
</form>
